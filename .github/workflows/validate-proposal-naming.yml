name: Validate Proposal Naming
permissions:
  contents: read

on:
  pull_request:
    paths:
      - '*/**'
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The PR number to validate the naming convention for'
        required: true
        type: string

jobs:
  validate-proposal-naming:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set PR number
        run: |
          # Set PR_NUMBER based on context: use inputs.pr_number for manual dispatch, 
          # otherwise use github.event.number for pull request events
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "PR_NUMBER=$(printf %04d ${{ inputs.pr_number }})" >> $GITHUB_ENV
            echo "Using PR number from manual input: $(printf %04d ${{ inputs.pr_number }})"
          else
            echo "PR_NUMBER=$(printf %04d ${{ github.event.number }})" >> $GITHUB_ENV
            echo "Using PR number from event: $(printf %04d ${{ inputs.pr_number }})"
          fi

      - name: Validate proposal naming
        run: |
          # Map of project folder -> RFC filename prefix. Add a line here when onboarding a new project.
          declare -A PREFIXES=(
            [toolhive]="THV"
          )

          # Get the list of NEW files added in a project folder (not modifications to existing files).
          # Only top-level project folders are considered; READMEs are not RFCs.
          CHANGED_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD | grep -E '^[^./][^/]*/[^/]+\.md$' | grep -vE '/README\.md$' || true)

          # Skip validation if no new proposal files are being added
          # (modifications to existing proposals don't need naming validation)
          if [ -z "$CHANGED_FILES" ]; then
            echo "ℹ️ No new proposal files added in this PR (only modifications to existing proposals or manual trigger)"
            exit 0
          fi

          echo "Checking proposal file naming convention..."
          echo "Files to check:"
          echo "$CHANGED_FILES"

          VALIDATION_FAILED=false

          # Check each changed file
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              filename=$(basename "$file")
              project=$(dirname "$file")
              echo "Checking file: $file"

              prefix="${PREFIXES[$project]:-}"
              if [ -z "$prefix" ]; then
                echo "❌ '$project' is not a registered project folder"
                echo "   Registered projects: ${!PREFIXES[*]}"
                echo "   Add it to the PREFIXES map in this workflow."
                VALIDATION_FAILED=true
                continue
              fi

              # Check if the filename follows the <PREFIX>-####-name pattern with the current PR number
              if echo "$filename" | grep -qE "^${prefix}-${PR_NUMBER}-.*\.md$"; then
                echo "✅ $filename follows the correct naming convention"
              else
                echo "❌ $filename does not follow the correct naming convention"
                echo "   Expected format: ${project}/${prefix}-${PR_NUMBER}-name-of-your-proposal.md"
                echo "   Where ${PR_NUMBER} is the current PR number"
                VALIDATION_FAILED=true
              fi
            fi
          done <<< "$CHANGED_FILES"

          # Check if any validation failed
          if [ "$VALIDATION_FAILED" = "true" ]; then
            echo ""
            echo "❌ Validation failed! Some proposal files do not follow the naming convention."
            echo ""
            echo "Proposal files must follow this naming pattern:"
            echo "  <project>/<PREFIX>-${PR_NUMBER}-name-of-your-proposal.md"
            echo ""
            echo "Where:"
            echo "  - <project> is the project folder (e.g. toolhive)"
            echo "  - <PREFIX>- is that project's prefix (e.g. THV-)"
            echo "  - ${PR_NUMBER} is the current PR number"
            echo "  - name-of-your-proposal is a descriptive name in kebab-case"
            echo "  - .md is the file extension"
            echo ""
            echo "Example of valid name for this PR:"
            echo "  - toolhive/THV-${PR_NUMBER}-new-feature-proposal.md"
            echo ""
            exit 1
          else
            echo ""
            echo "✅ All proposal files follow the correct naming convention!"
          fi
